<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f14"/>
      <stop offset="100%" style="stop-color:#1a1a24"/>
    </linearGradient>
    <linearGradient id="menuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c2c35"/>
      <stop offset="100%" style="stop-color:#232328"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3b30"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="menuClip">
      <rect x="680" y="130" width="300" height="270" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Red glow blob behind mic -->
  <circle cx="300" cy="320" r="180" fill="#ff3b30" opacity="0.06" filter="url(#softglow)"/>

  <!-- Waveform bars (left side background decoration) -->
  <g opacity="0.18" fill="#ff3b30">
    <rect x="60"  y="360" width="6" height="40"  rx="3"/>
    <rect x="74"  y="340" width="6" height="80"  rx="3"/>
    <rect x="88"  y="320" width="6" height="120" rx="3"/>
    <rect x="102" y="300" width="6" height="160" rx="3"/>
    <rect x="116" y="330" width="6" height="100" rx="3"/>
    <rect x="130" y="350" width="6" height="60"  rx="3"/>
    <rect x="144" y="310" width="6" height="140" rx="3"/>
    <rect x="158" y="290" width="6" height="180" rx="3"/>
    <rect x="172" y="345" width="6" height="70"  rx="3"/>
    <rect x="186" y="355" width="6" height="50"  rx="3"/>
  </g>
  <g opacity="0.10" fill="#ffffff">
    <rect x="60"  y="390" width="6" height="40"  rx="3"/>
    <rect x="74"  y="380" width="6" height="60"  rx="3"/>
    <rect x="88"  y="370" width="6" height="80"  rx="3"/>
    <rect x="102" y="360" width="6" height="100" rx="3"/>
    <rect x="116" y="375" width="6" height="70"  rx="3"/>
    <rect x="130" y="385" width="6" height="50"  rx="3"/>
    <rect x="144" y="365" width="6" height="90"  rx="3"/>
    <rect x="158" y="355" width="6" height="110" rx="3"/>
    <rect x="172" y="380" width="6" height="60"  rx="3"/>
    <rect x="186" y="390" width="6" height="40"  rx="3"/>
  </g>

  <!-- macOS menu bar strip -->
  <rect x="580" y="60" width="520" height="38" rx="8" fill="#1e1e26" stroke="#3a3a48" stroke-width="1"/>
  <!-- Menu bar items -->
  <text x="596" y="84" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" fill="#8a8a9a" letter-spacing="0.3">Zoom</text>
  <text x="644" y="84" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" fill="#8a8a9a">File</text>
  <text x="676" y="84" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" fill="#8a8a9a">Edit</text>
  <text x="710" y="84" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" fill="#8a8a9a">View</text>
  <!-- right side system tray -->
  <text x="822" y="84" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="12" fill="#6a6a7a">Sat 15:43</text>
  <!-- Mic icon in menu bar -->
  <rect x="900" y="67" width="28" height="24" rx="5" fill="#2e2e38"/>
  <!-- Simple mic shape -->
  <rect x="912" y="71" width="4" height="8" rx="2" fill="#c8c8d8"/>
  <path d="M909 77 Q909 83 914 83 Q919 83 919 77" fill="none" stroke="#c8c8d8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="914" y1="83" x2="914" y2="86" stroke="#c8c8d8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="911" y1="86" x2="917" y2="86" stroke="#c8c8d8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Red recording dot -->
  <circle cx="923" cy="70" r="4" fill="url(#redGlow)" filter="url(#glow)"/>
  <circle cx="923" cy="70" r="2.5" fill="#ff3b30"/>

  <!-- Dropdown menu card -->
  <rect x="680" y="104" width="300" height="278" rx="12" fill="url(#menuGrad)" stroke="#3a3a48" stroke-width="1" filter="url(#shadow)"/>

  <!-- Menu connector nub -->
  <path d="M913 104 L920 96 L927 104" fill="#2c2c35" stroke="#3a3a48" stroke-width="1"/>

  <!-- Menu item: Stop Recording (highlighted) -->
  <rect x="688" y="112" width="284" height="36" rx="7" fill="#ff3b30" opacity="0.15"/>
  <circle cx="708" cy="130" r="6" fill="url(#redGlow)"/>
  <circle cx="708" cy="130" r="3.5" fill="#ff5f57"/>
  <text x="724" y="135" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13.5" fill="#ff6b60" font-weight="500">Stop Recording</text>

  <!-- Timer line -->
  <text x="708" y="163" font-family="SF Mono, Menlo, monospace" font-size="11.5" fill="#5a5a6a">  00:42  recording…</text>

  <!-- Divider -->
  <line x1="692" y1="180" x2="972" y2="180" stroke="#3a3a48" stroke-width="1"/>

  <!-- Section header -->
  <text x="708" y="200" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11" fill="#4a4a5a" font-weight="600" letter-spacing="0.5">CAPTURE</text>

  <!-- Screen option -->
  <text x="722" y="222" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" fill="#9a9aaa">Screen (Main)  2560×1600</text>

  <!-- Section header -->
  <text x="708" y="248" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="11" fill="#4a4a5a" font-weight="600" letter-spacing="0.5">APP ONLY</text>

  <!-- Zoom option (selected) -->
  <text x="704" y="270" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" fill="#e0e0ea">✓</text>
  <text x="722" y="270" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" fill="#e0e0ea" font-weight="500">Zoom</text>

  <!-- Other app -->
  <text x="722" y="292" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" fill="#5a5a6a">Safari</text>

  <!-- Divider -->
  <line x1="692" y1="305" x2="972" y2="305" stroke="#3a3a48" stroke-width="1"/>

  <!-- Quit -->
  <text x="722" y="328" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="13" fill="#5a5a6a">Quit</text>

  <!-- Left side: main title block -->
  <text x="80" y="238"
    font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif"
    font-size="62"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-1.5">Meeting</text>
  <text x="80" y="308"
    font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif"
    font-size="62"
    font-weight="700"
    fill="#ff3b30"
    letter-spacing="-1.5">Recorder</text>

  <!-- Subtitle -->
  <text x="82" y="348"
    font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif"
    font-size="18"
    fill="#6a6a7e"
    letter-spacing="0.2">One-click meeting recorder for macOS</text>

  <!-- Feature pills -->
  <rect x="82" y="376" width="138" height="28" rx="14" fill="#1e1e2e" stroke="#2e2e42"/>
  <text x="151" y="395" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="12" fill="#7a7a9a" text-anchor="middle">No host permission</text>

  <rect x="230" y="376" width="108" height="28" rx="14" fill="#1e1e2e" stroke="#2e2e42"/>
  <text x="284" y="395" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="12" fill="#7a7a9a" text-anchor="middle">Screen + Audio + Mic</text>

  <rect x="348" y="376" width="80" height="28" rx="14" fill="#1e1e2e" stroke="#2e2e42"/>
  <text x="388" y="395" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="12" fill="#7a7a9a" text-anchor="middle">macOS 13+</text>

  <!-- Bottom: subtle author line -->
  <text x="600" y="598"
    font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif"
    font-size="12"
    fill="#3a3a4a"
    text-anchor="middle"
    letter-spacing="1">github.com/miguelAngelo1999/MeetingRecorder</text>

  <!-- Thin red accent line at bottom -->
  <rect x="0" y="620" width="1200" height="3" fill="url(#redGlow)" opacity="0.6"/>
</svg>
